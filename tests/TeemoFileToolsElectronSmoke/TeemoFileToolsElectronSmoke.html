<!doctype html>
<html>
<head><meta charset="UTF-8"><title>Teemo File Tools Smoke</title></head>
<body>
  <script>window.TeemoPermissionPrompt = { request: () => new Promise(() => {}) };</script>
  <script src="../../src/permissions/TeemoPermissionClient.js"></script>
  <script src="../../src/tools/TeemoToolRegistry.js"></script>
  <script src="../../src/tools/file/TeemoFileClient.js"></script>
  <script src="../../src/tools/file/TeemoFileTools.js"></script>
  <script>
    const { ipcRenderer } = require('electron');
    const permissionClient = new window.TeemoPermissionClient({ ipcRenderer });
    const fileClient = new window.TeemoFileClient({ ipcRenderer });
    const registry = new window.TeemoToolRegistry({ permissionService: permissionClient });
    window.TeemoFileTools.register(registry, { fileClient });
    window.runFileTool = (name, args, sessionId = 'file-smoke-session') => registry.execute(name, args, {
      runId: `run-${name}`,
      sessionId,
      step: 1,
    });
    window.runAbortedFileTool = (name, args) => {
      const controller = new AbortController();
      const execution = registry.execute(name, args, {
        runId: `run-abort-${name}`,
        sessionId: 'file-abort-session',
        step: 1,
        signal: controller.signal,
      });
      setTimeout(() => controller.abort(), 25);
      return execution;
    };
    window.TeemoFileToolsSmokeReady = true;
  </script>
</body>
</html>
